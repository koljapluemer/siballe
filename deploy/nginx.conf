# siballe nginx config — committed source of truth, symlinked into
# /etc/nginx/sites-available/siballe on the VPS. See DEPLOY.md for full setup.
#
# Same-origin, path-routed layout: the Flutter web build is served at "/",
# and "/api/", "/admin/", "/static/" are proxied to gunicorn. This means the
# frontend and backend share one origin and CORS is not needed in production.
#
# server_name is the bare VPS IP for now (no domain yet). Once a domain is
# bought, DEPLOY.md's HTTPS appendix has you update this and re-run certbot.

upstream siballe_gunicorn {
    server unix:/run/siballe/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_VPS_IP;

    client_max_body_size 5M;

    location /static/ {
        alias /opt/siballe/app/backend/staticfiles/;
    }

    location /api/ {
        proxy_pass http://siballe_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://siballe_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /opt/siballe/frontend-web;
        try_files $uri $uri/ /index.html;
    }
}
